name: Smoke test (real Paper server)

# Boots a real Paper server with the plugin installed, runs a few console commands and
# checks the output. This catches plugin.yml mistakes, missing message keys that are
# read on enable, and command registration errors that a plain compile cannot see.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the plugin
        run: mvn -B -ntp clean package

      - name: Download Paper 1.21.11
        run: |
          set -euo pipefail
          API=https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds
          curl -sf "$API" -o builds.json
          BUILD=$(jq -r '[.builds[].build] | max' builds.json)
          echo "Paper build $BUILD"
          curl -sf -o paper.jar \
            "$API/$BUILD/downloads/paper-1.21.11-$BUILD.jar"
          ls -l paper.jar

      - name: Run the server with the plugin
        run: |
          set -uo pipefail
          mkdir -p server/plugins
          cp target/MaterialShop-*.jar server/plugins/
          cd server
          echo "eula=true" > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          level-type=minecraft\:flat
          spawn-protection=0
          max-players=5
          view-distance=4
          sync-chunk-writes=false
          EOF
          mkfifo console
          ( java -Xms1G -Xmx2G -jar ../paper.jar --nogui < console > out.log 2>&1 ; \
            echo "$?" > exit.code ) &
          SERVER_PID=$!
          exec 3> console

          # wait for the server to finish loading (3 minutes max)
          for i in $(seq 1 90); do
            grep -q 'Done (' out.log 2>/dev/null && break
            sleep 2
          done
          grep -q 'Done (' out.log || { echo '::error::server never finished starting'; tail -60 out.log; exit 1; }

          send() { echo "$1" >&3; sleep 2; }
          send "shopadmin create smoketest"
          send "shopadmin list"
          send "shop list"
          send "shop"
          send "plugins"
          send "stop"

          wait $SERVER_PID || true

          echo '===== server log (tail) ====='
          tail -n 80 out.log

      - name: Check the plugin loaded and worked
        run: |
          set -e
          cd server
          fail() { echo "::error::$1"; grep -n 'MaterialShop\|Exception\|ERROR' out.log | head -40; exit 1; }
          grep -q 'MaterialShop enabled' out.log || fail 'plugin did not enable'
          if grep -qi 'Could not load .*MaterialShop\|Unsupported api-version\|Unknown command' out.log; then
            fail 'plugin.yml / command registration problem'
          fi
          if grep -qi 'Exception' out.log; then
            fail 'an exception was thrown'
          fi
          grep -q 'Only players can use this' out.log || fail '/shop did not answer a console sender'
          grep -q 'MaterialShop' out.log || fail 'no MaterialShop output'
          echo '--- shops.yml written at shutdown ---'
          cat plugins/MaterialShop/shops.yml
          grep -q 'name: smoketest' plugins/MaterialShop/shops.yml || fail 'admin shop was not persisted'
          echo 'Smoke test OK'
