name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile against the Paper API
        run: mvn -B -ntp clean package

      # Guard against the "build is green but the jar is empty" failure mode.
      - name: Verify the jar
        run: |
          set -e
          JAR=$(ls target/MaterialShop-*.jar | head -n 1)
          echo "Checking $JAR"
          unzip -l "$JAR" | grep -q 'plugin.yml' \
            || { echo "::error::plugin.yml missing from $JAR"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/banglaverse/materialshop/MaterialShop.class' \
            || { echo "::error::compiled classes missing from $JAR"; exit 1; }
          if unzip -p "$JAR" plugin.yml | grep -q '\${'; then
            echo "::error::plugin.yml still contains an unexpanded placeholder"
            unzip -p "$JAR" plugin.yml
            exit 1
          fi
          unzip -p "$JAR" plugin.yml
          echo "Jar OK"

      - uses: actions/upload-artifact@v6
        with:
          name: MaterialShop-jar
          path: target/MaterialShop-*.jar
          if-no-files-found: error
