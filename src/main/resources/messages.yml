prefix: "&8[&6MaterialShop&8] &7"
players-only: "{prefix}&cOnly players can use this."
no-permission: "{prefix}&cYou do not have permission."
help:
  - "&6MaterialShop &7commands"
  - "&e/shop &7open the shop menu"
  - "&e/shop create [name] &7turn the chest or barrel you look at into a shop"
  - "&e/shop list &7your shops"
  - "&e/shop collect &7open your collect box"
shop-created: "{prefix}Shop &e{name}&7 created. Add listings in the menu."
shop-limit: "{prefix}&cYou already have {limit} shops."
not-container: "{prefix}&cLook at a chest or barrel (within 5 blocks)."
already-shop: "{prefix}&cThat container is already a shop."
claim-denied: "{prefix}&cYou cannot build there, so you cannot make a shop there."
break-denied: "{prefix}&cThis is a shop container. Close the shop from the menu first."
adjacent-denied: "{prefix}&cYou cannot place a chest next to a shop chest."
trade-success: "{prefix}&aBought &f{qty}x {item}&a for &f{pay}&a."
trade-sold: "{prefix}&e{buyer}&7 bought &f{qty}x {item}&7 from your shop &e{shop}&7. Payment is in your collect box."
err-no-stock: "{prefix}&cThe shop does not have enough stock."
err-no-payment: "{prefix}&cYou do not have enough of the payment item."
err-no-room: "{prefix}&cYour inventory does not have room."
err-box-full: "{prefix}&cThe seller cannot receive more payment right now."
err-own-shop: "{prefix}&cYou cannot buy from your own shop."
err-gone: "{prefix}&cThat shop or listing no longer exists."
err-bad-qty: "{prefix}&cInvalid quantity."
err-broken: "{prefix}&cThe shop container is missing."
prompt-qty: "{prefix}Type the quantity in chat, or type &ecancel&7."
prompt-rename: "{prefix}Type the new shop name in chat (max 24 characters), or type &ecancel&7."
prompt-timeout: "{prefix}&cPrompt timed out."
renamed: "{prefix}Shop renamed to &e{name}&7."
setup-no-item: "{prefix}&cPut the item you want to sell in the top slot."
setup-no-price: "{prefix}&cPut at least one payment item in the payment slots."
setup-blocked: "{prefix}&c{item} cannot be used as payment."
setup-too-many: "{prefix}&cThis shop has too many listings."
fair-warn: "{prefix}&eWarning: this price looks very lopsided compared to the value table."
listing-added: "{prefix}Listing added."
listing-removed: "{prefix}Listing removed."
close-confirm: "{prefix}&cClick Close shop again to confirm."
shop-closed: "{prefix}Shop closed. Stock stays in the container."
collected: "{prefix}Collected items."
admin-created: "{prefix}Admin shop &e{name}&7 created."
admin-removed: "{prefix}Shop removed."
admin-not-found: "{prefix}&cNo shop with that name."
name-taken: "{prefix}&cThat name is already used."
npc-spawned: "{prefix}Shop villager placed."
reload: "{prefix}Reloaded."
