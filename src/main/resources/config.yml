# MaterialShop configuration
default-shop-limit: 5          # chest shops per player; permission materialshop.limit.<n> raises it
max-listings: 100              # listings per shop
max-quantity: 2304             # max units in one purchase
collect-capacity: 45           # stacks in each collect box (max 45)
prompt-timeout-seconds: 30     # chat prompt for custom quantity and rename

# Items that can never be used as payment in player shops (admin shops ignore this list).
# Spawn eggs and non-item materials are always blocked.
payment-blacklist:
  - AIR
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - LIGHT
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - SPAWNER
  - REINFORCED_DEEPSLATE
  - END_PORTAL_FRAME
# If not empty, ONLY these materials are accepted as payment in player shops.
payment-whitelist: []

# Optional value table used only for a fairness warning when a listing is very lopsided.
# It never blocks a listing or a trade.
fairness-warning-ratio: 3.0    # 0 disables the warning
values:
  COPPER_INGOT: 1
  IRON_INGOT: 2
  GOLD_INGOT: 4
  EMERALD: 8
  DIAMOND: 16
  NETHERITE_INGOT: 128

log-max-bytes: 2000000         # transactions.log is rotated above this size

market:
  max-listings-per-player: 20
  expiry-hours: 0              # 0 = listings never expire; otherwise stock returns to the seller's collect box

chest-shops:
  enabled: true                # false hides every chest shop button and command

# Optional category overrides for the market tabs. Materials listed here are forced into that tab.
# Tabs: BLOCKS, TOOLS, ARMOR, FOOD, REDSTONE, FARMING, ORES, MISC. Named custom items go to MISC.
categories:
  MISC: []
