# MaterialShop server shop catalog.
# Every section below becomes one server shop (unlimited stock) in the Server shops menu.
# You never have to add items one by one. Edit this file and run /shopadmin reload.
#
# Item line format:   "ITEM amount = PAYMENT amount | PAYMENT amount | ..."
#   - the left side is what the player GETS for one purchase
#   - after the = sign come up to 4 payment options, separated by |. The player pays with ONE of them.
#   - ITEM names are Bukkit material names, for example COBBLESTONE or DIAMOND_PICKAXE
#   - amounts above the normal stack size are lowered to the stack size
# Server shop payments are consumed. Lines with a wrong material name are skipped and logged.
#
# To add a new section copy one block and give it a new key. To remove a section delete its block.
# Set catalog.enabled: false in config.yml to turn the catalog off.

